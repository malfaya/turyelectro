services:
  postgres:
    image: postgres:16-alpine
    container_name: turyelectro-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-turyelectro}
      POSTGRES_USER: ${POSTGRES_USER:-turyelectro}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-turyelectro123}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-turyelectro} -d ${POSTGRES_DB:-turyelectro}"]
      interval: 5s
      timeout: 5s
      retries: 10

  migrate:
    image: migrate/migrate:v4.18.1
    profiles: ["tools"]
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ./migrations:/migrations:ro
    entrypoint: ["migrate"]
    command:
      - "-path=/migrations"
      - "-database=postgres://${POSTGRES_USER:-turyelectro}:${POSTGRES_PASSWORD:-turyelectro123}@postgres:5432/${POSTGRES_DB:-turyelectro}?sslmode=disable"
      - "up"

volumes:
  postgres_data:
