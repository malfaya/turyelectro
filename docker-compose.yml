services:
  postgres:
    image: postgres:16-alpine
    container_name: turyelectro_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-turyelectro}
      POSTGRES_USER: ${POSTGRES_USER:-turyelectro}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-turyelectro123}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./db/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-turyelectro} -d ${POSTGRES_DB:-turyelectro}"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
